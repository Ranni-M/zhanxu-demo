name: Deploy static demo

# 把应用构建成不需要服务端的静态演示版，发布到 GitHub Pages 作为公网预览地址。
# 完整功能（注册登录、上传、发布、导出）仍然需要 deploy/bootstrap.sh 部署的那台服务器。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'shared/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages 未启用时自动开启（等价于在 Settings → Pages 里把 Source 选成 GitHub Actions）。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
